# Appends one app to the Registry table in ObjectRegistry.md and removes that
# range from the Free ranges table. A free-range row may be shortened, split
# into two rows, or removed. Repo name, repo URL, and repo visibility are optional.
# A repo URL is stored as a hyperlink on the repo name with target="_blank".

name: Add registry row

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        type: string
      app_id:
        description: App ID
        required: true
        type: string
      object_ranges:
        description: "Object range(s), for example 50000-50010 or 50601-50620; 50621-50650"
        required: true
        type: string
      app_type:
        description: Type
        required: true
        type: choice
        options:
          - PTE
          - AppSource
      repo_name:
        description: GitHub or DevOps repo name, if available
        required: false
        type: string
      repo_url:
        description: Repo URL, if available. Linked from the repo name with target="_blank".
        required: false
        type: string
      repo_visibility:
        description: Repo visibility, if available
        required: false
        type: choice
        default: Not provided
        options:
          - Not provided
          - Public
          - Private

concurrency:
  group: object-registry-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    name: Append an app and update free ranges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Use script from this workflow run
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch origin "${{ github.ref }}" --depth=1
          git checkout "${{ github.sha }}" -- .github/scripts/add_registry_row.py .github/scripts/allocate_range.py

      - name: Add registry row
        id: add
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          OBJECT_RANGES: ${{ inputs.object_ranges }}
          APP_TYPE: ${{ inputs.app_type }}
          REPO_NAME: ${{ inputs.repo_name }}
          REPO_URL: ${{ inputs.repo_url }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
        run: |
          python3 .github/scripts/add_registry_row.py \
            --name "$APP_NAME" \
            --app-id "$APP_ID" \
            --ranges "$OBJECT_RANGES" \
            --type "$APP_TYPE" \
            --repo-name "$REPO_NAME" \
            --repo-url "$REPO_URL" \
            --visibility "$REPO_VISIBILITY" \
            --output-env "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit registry row to main
        env:
          APP: ${{ steps.add.outputs.app }}
          RANGES: ${{ steps.add.outputs.ranges }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ObjectRegistry.md registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
            exit 0
          fi
          git commit -m "$(printf 'Register %s (%s)' "$APP" "$RANGES")"
          git push origin HEAD:main
